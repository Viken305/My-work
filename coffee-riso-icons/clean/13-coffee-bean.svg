  <g id="blue-over-pink" clip-path="url(#riso-coffee-bean-pink-area)" fill="none" stroke="#002284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="96" cy="96" rx="46" ry="62" transform="rotate(-30 96 96)"/>
