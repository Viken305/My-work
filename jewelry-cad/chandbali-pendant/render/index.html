<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f3ece2}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1400,H=+q.get('h')||1400;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(q.get('bg')||'#efe6da');
const pm=new THREE.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(-30,60,80);s.add(dl);
const mats={gold:new THREE.MeshStandardMaterial({color:0xd9a441,metalness:1,roughness:0.32}),
 gems:new THREE.MeshStandardMaterial({color:0xeef3f7,metalness:0.1,roughness:0.08}),
 pearl:new THREE.MeshStandardMaterial({color:0xf5efe4,metalness:0.05,roughness:0.28}),
 beads:new THREE.MeshStandardMaterial({color:0x2e6b52,metalness:0,roughness:0.35})};
const files=(q.get('f')||'00_pendant_assembly_gold:gold,ref_diamonds_polki:gems,ref_pearl:pearl,ref_green_beads_emerald:beads').split(',');
const L=new STLLoader();const g=new THREE.Group();s.add(g);
Promise.all(files.map(x=>{const [n,m]=x.split(':');return L.loadAsync('out/'+n+'.stl').then(geo=>{geo.computeVertexNormals();g.add(new THREE.Mesh(geo,mats[m]));});})).then(()=>{
 const b=new THREE.Box3().setFromObject(g);const c=b.getCenter(new THREE.Vector3());const sz=b.getSize(new THREE.Vector3());
 const tx=+(q.get('tx')??c.x),ty=+(q.get('ty')??c.y),span=+(q.get('span')||Math.max(sz.x,sz.y)*1.1);
 const cam=new THREE.OrthographicCamera(-span/2,span/2,span/2,-span/2,-500,500);
 const az=(+q.get('az')||0)*Math.PI/180,el=(+q.get('el')||0)*Math.PI/180;
 cam.position.set(tx+100*Math.sin(az)*Math.cos(el),ty+100*Math.sin(el),c.z+100*Math.cos(az)*Math.cos(el));cam.lookAt(tx,ty,c.z);
 r.render(s,cam);document.title='done';});
</script></body></html>
